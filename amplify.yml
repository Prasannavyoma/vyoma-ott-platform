version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|NEXT_PUBLIC_|RAZORPAY_|VAPID_|WP_|ADMIN_|GEMINI_|CRON_|GMAIL_|SMTP_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
